name: Daily Data Update

on:
  schedule:
    # Runs daily at 9am Spain time year-round
    # Using 7am UTC = 8am CET (winter), 9am CEST (summer)
    - cron: '0 7 * * *'  # 7am UTC = 9am Spain (summer) / 8am Spain (winter)
  workflow_dispatch:  # Allows manual triggering from GitHub Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push changes back to the repository
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for git diff
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install Python dependencies
      run: |
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
    
    - name: Run data processor script
      id: data-processor
      run: |
        node scripts/data-processor.js || exit 1
    
    - name: Generate homepage data
      run: |
        python3 generate_homepage_data.py || echo "Homepage data generation skipped"
      continue-on-error: true
    
    - name: Read statistics
      id: stats
      if: always()
      run: |
        if [ -f data-update-stats.json ]; then
          # Read stats file and set outputs
          STATS=$(cat data-update-stats.json)
          echo "stats<<EOF" >> $GITHUB_OUTPUT
          echo "$STATS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        else
          echo '{"success": false, "error": "Stats file not created"}' > $GITHUB_OUTPUT
        fi
    
    - name: Check for changes
      id: git-check
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        if git diff --quiet data/; then
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "No changes to commit"
        else
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "Changes detected in data/ folder"
        fi
    
    - name: Commit and push changes
      if: steps.git-check.outputs.changed == 'true' && steps.data-processor.outcome == 'success'
      run: |
        git add data/
        git add data-update-stats.json || true
        git commit -m "🤖 Automated daily data update - $(date +'%Y-%m-%d %H:%M:%S UTC')" || exit 0
        git push origin main
    
    - name: Prepare email content
      if: always()
      id: email-content
      run: |
        STATS_FILE="data-update-stats.json"
        CURRENT_DATE=$(date +'%Y-%m-%d %H:%M:%S %Z')
        
        if [ -f "$STATS_FILE" ] && [ "${{ steps.data-processor.outcome }}" == "success" ]; then
          # Success email - parse JSON using Node.js (more reliable)
          TOTAL_HOTELS=$(node -e "try { const d=require('./data-update-stats.json'); console.log(d.totalHotels || 0); } catch(e) { console.log(0); }")
          TOTAL_DESTINATIONS=$(node -e "try { const d=require('./data-update-stats.json'); console.log(d.totalDestinations || 0); } catch(e) { console.log(0); }")
          TOTAL_FILES=$(node -e "try { const d=require('./data-update-stats.json'); console.log(d.totalJsonFiles || 0); } catch(e) { console.log(0); }")
          DEST_FILES=$(node -e "try { const d=require('./data-update-stats.json'); console.log(d.destinationFiles || 0); } catch(e) { console.log(0); }")
          COUNTRY_FILES=$(node -e "try { const d=require('./data-update-stats.json'); console.log(d.countryFiles || 0); } catch(e) { console.log(0); }")
          
          SUBJECT="✅ MondoExplora Daily Update Success - $CURRENT_DATE"
          
          # Build HTML email body with proper line breaks
          BODY="<p>Hello!</p>"
          BODY+="<p>The daily data update for MondoExplora completed successfully.</p>"
          BODY+="<h3>📊 Update Statistics:</h3>"
          BODY+="<ul style='margin: 10px 0; padding-left: 20px;'>"
          BODY+="<li><strong>Date/Time:</strong> $CURRENT_DATE</li>"
          BODY+="<li><strong>Total Hotels Processed:</strong> $TOTAL_HOTELS</li>"
          BODY+="<li><strong>Total Destinations:</strong> $TOTAL_DESTINATIONS</li>"
          BODY+="<li><strong>JSON Files Created:</strong> $TOTAL_FILES</li>"
          BODY+="<ul style='margin: 5px 0; padding-left: 20px;'>"
          BODY+="<li>Destination files: $DEST_FILES</li>"
          BODY+="<li>Country files: $COUNTRY_FILES</li>"
          BODY+="<li>Homepage file: 1</li>"
          BODY+="</ul></li>"
          BODY+="</ul>"
          BODY+="<h3>🔄 Git Status:</h3>"
          BODY+="<ul style='margin: 10px 0; padding-left: 20px;'>"
          BODY+="<li><strong>Changes committed:</strong> ${{ steps.git-check.outputs.changed }}</li>"
          BODY+="<li>Netlify will automatically rebuild the site</li>"
          BODY+="</ul>"
          BODY+="<p>You can view the full statistics in: <code>data-update-stats.json</code></p>"
          BODY+="<hr>"
          BODY+="<p><em>This is an automated message from GitHub Actions.</em></p>"
        else
          # Error email
          ERROR_MSG=$(cat $STATS_FILE | grep -o '"error":"[^"]*"' | cut -d'"' -f4 || echo "Unknown error")
          
          SUBJECT="❌ MondoExplora Daily Update FAILED - $CURRENT_DATE"
          
          # Build email body without heredoc
          BODY="Hello!"$'\n\n'
          BODY+="⚠️ The daily data update for MondoExplora FAILED."$'\n\n'
          BODY+="📊 Error Details:"$'\n'
          BODY+="• Date/Time: $CURRENT_DATE"$'\n'
          BODY+="• Error: $ERROR_MSG"$'\n\n'
          BODY+="🔍 Next Steps:"$'\n'
          BODY+="1. Check the GitHub Actions logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"$'\n'
          BODY+="2. Review the error in data-update-stats.json"$'\n'
          BODY+="3. Manually run the script if needed: node scripts/data-processor.js"$'\n\n'
          BODY+="---"$'\n'
          BODY+="This is an automated message from GitHub Actions."
        fi
        
        # Set GitHub Actions output
        echo "subject<<EOF" >> $GITHUB_OUTPUT
        echo "$SUBJECT" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        echo "body<<EOF" >> $GITHUB_OUTPUT
        echo "$BODY" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    
    - name: Send email notification
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ secrets.SMTP_SERVER }}
        server_port: ${{ secrets.SMTP_PORT }}
        username: ${{ secrets.SMTP_USERNAME }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: ${{ steps.email-content.outputs.subject }}
        html_body: ${{ steps.email-content.outputs.body }}
        to: ${{ secrets.EMAIL_TO }}
        from: ${{ secrets.EMAIL_FROM }}
      continue-on-error: true  # Don't fail workflow if email fails
